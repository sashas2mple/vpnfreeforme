<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Переход в Happ...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 16px 32px;
      background: #3b82f6;
      color: #ffffff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 18px;
    }
    .hint {
      margin-top: 16px;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h2>Открываем приложение Happ...</h2>
  <a id="openBtn" class="btn" href="#">🚀 Добавить в Happ</a>
  <p class="hint">Если приложение не открылось автоматически, нажми на синюю кнопку выше</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const url = params.get("url");
    if (url) {
      const deepLink = url.startsWith("happ://") ? url : "happ://add/" + url;
      document.getElementById("openBtn").href = deepLink;
      window.location.replace(deepLink);
    }
  </script>
</body>
</html>
