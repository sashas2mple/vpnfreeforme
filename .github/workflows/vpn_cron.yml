name: Auto Trial VPN (Every 71 Hours)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-vpn-subs:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Проверяем, прошёл ли 71 час с прошлой отправки
        id: check_time
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ ! -f last_run.txt ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          LAST_RUN=$(cat last_run.txt | tr -d '[:space:]')
          NOW=$(date +%s)
          DIFF=$((NOW - LAST_RUN))
          if [ "$DIFF" -ge 255600 ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Устанавливаем Python
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Устанавливаем библиотеки и браузер
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Генерируем подписки и отправляем в Telegram
        if: steps.check_time.outputs.should_run == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHAT_ID_1: ${{ secrets.CHAT_ID_1 }}
          CHAT_ID_2: ${{ secrets.CHAT_ID_2 }}
          CHAT_ID_3: ${{ secrets.CHAT_ID_3 }}
          CHAT_ID_4: ${{ secrets.CHAT_ID_4 }}
        run: python auto_trial.py

      - name: Запоминаем точное время отправки (для отсчёта 71 часа)
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          date +%s > last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          git diff --staged --quiet || git commit -m "Update last_run timestamp (71h timer)"
          git push
