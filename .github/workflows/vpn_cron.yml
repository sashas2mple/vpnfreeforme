name: Auto Trial VPN (Every 71 Hours)

on:
  schedule:
    # Проверяет таймер и нажатия кнопок в Telegram каждые 15 минут
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      target_user:
        description: 'Кому отправить ссылку?'
        required: true
        default: 'Всем (обычный запуск со сбросом таймера)'
        type: choice
        options:
          - 'Всем (обычный запуск со сбросом таймера)'
          - '0 — Прислать мне список: кто под каким номером'
          - '1 — Только мне (без сброса таймера)'
          - '2 — Только Другу 1 (без сброса таймера)'
          - '3 — Только Другу 2 (без сброса таймера)'
          - '4 — Только Другу 3 (без сброса таймера)'
          - '5 — Только Другу 4 (без сброса таймера)'

permissions:
  contents: write

jobs:
  send-vpn-subs:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Проверяем таймер 71ч и нажатия кнопки «Прислать новую» в Telegram
        id: check_time
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHAT_ID_1: ${{ secrets.CHAT_ID_1 }}
          CHAT_ID_2: ${{ secrets.CHAT_ID_2 }}
          CHAT_ID_3: ${{ secrets.CHAT_ID_3 }}
          CHAT_ID_4: ${{ secrets.CHAT_ID_4 }}
          CHAT_ID_5: ${{ secrets.CHAT_ID_5 }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TARGET: ${{ github.event.inputs.target_user }}
        run: python3 auto_trial.py --check-only

      - name: Устанавливаем Python и браузер (только если нужна генерация ссылок)
        if: steps.check_time.outputs.need_browser == 'true'
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Генерируем подписки и отправляем в Telegram
        if: steps.check_time.outputs.should_run == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHAT_ID_1: ${{ secrets.CHAT_ID_1 }}
          CHAT_ID_2: ${{ secrets.CHAT_ID_2 }}
          CHAT_ID_3: ${{ secrets.CHAT_ID_3 }}
          CHAT_ID_4: ${{ secrets.CHAT_ID_4 }}
          CHAT_ID_5: ${{ secrets.CHAT_ID_5 }}
          RUN_MODE: ${{ steps.check_time.outputs.run_mode }}
          TARGET_IDS: ${{ steps.check_time.outputs.target_ids }}
        run: python3 auto_trial.py

      - name: Сохраняем состояние таймера и обработанных кнопок
        if: steps.check_time.outputs.state_changed == 'true' || steps.check_time.outputs.reset_timer == 'true'
        run: |
          if [ "${{ steps.check_time.outputs.reset_timer }}" = "true" ]; then
            echo "${{ steps.check_time.outputs.run_start }}" > last_run.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_run.txt tg_state.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update VPN bot state & timer"
          git pull --rebase origin main || true
          git push
