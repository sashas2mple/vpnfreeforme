name: Auto Trial VPN (Every 71 Hours)

on:
  schedule:
    - cron: '12,32,52 * * * *'
  workflow_dispatch:
    inputs:
      target_user:
        description: 'Кому отправить ссылку?'
        required: true
        default: 'Всем (обычный запуск со сбросом таймера)'
        type: choice
        options:
          - 'Всем (обычный запуск со сбросом таймера)'
          - '1 — Только мне (без сброса таймера)'
          - '2 — Только Другу 1 (без сброса таймера)'
          - '3 — Только Другу 2 (без сброса таймера)'
          - '4 — Только Другу 3 (без сброса таймера)'
          - '5 — Только Другу 4 (без сброса таймера)'

permissions:
  contents: write

jobs:
  send-vpn-subs:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Проверяем, прошёл ли 71 час с прошлой отправки
        id: check_time
        run: |
          NOW=$(date +%s)
          echo "run_start=$NOW" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Ручной запуск — старт!"
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ ! -f last_run.txt ]; then
            echo "Файл last_run.txt не найден — первый запуск!"
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          LAST_RUN=$(cat last_run.txt | tr -d '[:space:]')
          DIFF=$((NOW - LAST_RUN))
          # 252600 секунд = 70 ч. 10 мин. (с учётом очереди GitHub придёт ровно к ~71 ч.)
          if [ "$DIFF" -ge 252600 ]; then
            echo "Прошло $((DIFF / 3600)) ч. $(((DIFF % 3600) / 60)) мин. — пора запускать!"
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "Прошло $((DIFF / 3600)) ч. $(((DIFF % 3600) / 60)) мин. из 71 ч. — ждём."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Устанавливаем Python
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Устанавливаем библиотеки и браузер
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Генерируем подписки и отправляем в Telegram
        if: steps.check_time.outputs.should_run == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHAT_ID_1: ${{ secrets.CHAT_ID_1 }}
          CHAT_ID_2: ${{ secrets.CHAT_ID_2 }}
          CHAT_ID_3: ${{ secrets.CHAT_ID_3 }}
          CHAT_ID_4: ${{ secrets.CHAT_ID_4 }}
          CHAT_ID_5: ${{ secrets.CHAT_ID_5 }}
          TARGET_USER: ${{ github.event.inputs.target_user }}
        run: python auto_trial.py

      - name: Запоминаем точное время старта (только при общем запуске)
        if: steps.check_time.outputs.should_run == 'true' && (github.event_name == 'schedule' || github.event.inputs.target_user == 'Всем (обычный запуск со сбросом таймера)')
        run: |
          echo "${{ steps.check_time.outputs.run_start }}" > last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          git diff --staged --quiet || git commit -m "Update last_run timestamp (71h timer)"
          git pull --rebase origin main || true
          git push
